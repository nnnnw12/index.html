<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лиана Крутикова | Мастер маникюра со стажем 15 лет</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #f8bbd0;
            --accent: #e57399;
            --tg-color: #24A1DE;
            --dark: #212121;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        * { box-sizing: border-box; transition: all 0.3s ease; }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #fafafa;
            margin: 0;
            padding: 0;
            color: var(--dark);
            line-height: 1.6;
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), 
                        url('https://images.unsplash.com/photo-1604654894610-df490c9a55af?auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: var(--white);
            text-align: center;
            padding: 20px;
            clip-path: polygon(0 0, 100% 0, 100% 90%, 0% 100%);
        }

        header h1 {
            font-size: clamp(1.8rem, 8vw, 3.5rem); 
            margin: 0;
            letter-spacing: clamp(2px, 2vw, 8px);
            font-weight: 700;
            text-transform: uppercase;
            animation: fadeInDown 1s ease;
        }

        header p {
            font-size: clamp(0.9rem, 3vw, 1.2rem);
            letter-spacing: 3px;
            opacity: 0.9;
            margin-top: 10px;
            animation: fadeInUp 1.2s ease;
        }

        .container {
            max-width: 1100px;
            margin: -50px auto 50px;
            padding: 0 15px;
        }

        .section-card {
            background: var(--white);
            border-radius: 25px;
            padding: clamp(20px, 5vw, 40px);
            box-shadow: var(--shadow);
            margin-bottom: 40px;
        }

        h2 {
            font-weight: 700;
            text-align: center;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: clamp(1.2rem, 4vw, 1.8rem);
        }

        h2::after {
            content: ''; display: block; width: 50px; height: 4px; 
            background: var(--accent); margin: 15px auto; border-radius: 2px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 15px;
        }

        .gallery-item {
            position: relative;
            height: 380px;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            background: #eee;
        }

        .gallery-item img {
            width: 100%; height: 100%; object-fit: cover;
            image-rendering: -webkit-optimize-contrast;
            transition: transform 0.8s cubic-bezier(0.2, 1, 0.3, 1);
        }

        .gallery-item:hover img { transform: scale(1.1); }

        .features {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 25px;
            text-align: center;
            margin: 40px 0;
        }

        .feature-item i { font-size: 2.5rem; color: var(--accent); margin-bottom: 15px; }
        .feature-item div { font-weight: bold; margin-bottom: 10px; font-size: 1.1rem; }
        .feature-item p { font-size: 0.9rem; color: #666; margin: 0; }

        .price-table { width: 100%; border-collapse: collapse; }
        .price-table tr { border-bottom: 1px solid #f0f0f0; }
        .price-table td { padding: 20px 0; font-size: clamp(0.9rem, 3vw, 1.1rem); }
        .price-table .cost { text-align: right; font-weight: 700; color: var(--accent); font-size: clamp(1.1rem, 4vw, 1.3rem); }

        /* ОТЗЫВЫ СТИЛИ */
        .reviews-list { margin-top: 30px; max-height: 500px; overflow-y: auto; }
        .review-item { 
            border-bottom: 1px solid #eee; 
            padding: 15px 0; 
            animation: fadeInUp 0.5s ease;
        }
        .review-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px; }
        .review-name { font-weight: bold; color: var(--dark); }
        .stars { color: #FFD700; font-size: 0.9rem; }
        .review-text { font-size: 0.95rem; color: #555; }
        
        .review-form { display: flex; flex-direction: column; gap: 10px; margin-top: 20px; }
        .review-form input, .review-form textarea {
            padding: 12px; border: 1px solid #ddd; border-radius: 10px; font-family: inherit;
        }
        .review-btn {
            background: var(--accent); color: white; border: none; padding: 12px;
            border-radius: 10px; cursor: pointer; font-weight: bold;
        }
        .review-btn:disabled { background: #ccc; }
        .already-voted { color: #888; text-align: center; font-style: italic; display: none; margin-top: 20px; }

        /* НОВЫЕ СТИЛИ ДЛЯ ЗВЕЗД И СТАТИСТИКИ */
        .rating-summary {
            text-align: center; margin-bottom: 20px; padding: 15px; background: #fff5f8; border-radius: 15px;
        }
        .avg-num { font-size: 2.5rem; font-weight: 700; color: var(--accent); display: block; }
        
        .star-selection {
            display: flex; flex-direction: row-reverse; justify-content: center; gap: 5px; margin-bottom: 10px;
        }
        .star-selection input { display: none; }
        .star-selection label { font-size: 30px; color: #ddd; cursor: pointer; }
        .star-selection label:hover, .star-selection label:hover ~ label,
        .star-selection input:checked ~ label { color: #FFD700; }

        .btn {
            display: flex; align-items: center; justify-content: center; gap: 15px;
            padding: 20px; border-radius: 50px; text-decoration: none;
            font-weight: 700; font-size: 1.1rem; margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .btn-tg { background: var(--tg-color); color: white; }
        .btn-call { background: var(--dark); color: white; }
        .btn-share { background: #f0f0f0; color: var(--dark); border: 1px solid #ddd; }
        
        .btn:hover { transform: translateY(-5px); filter: brightness(1.05); }

        .float-tg {
            position: fixed; bottom: 30px; right: 30px; background: var(--tg-color);
            width: 65px; height: 65px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: white; font-size: 2rem; z-index: 100;
            box-shadow: 0 10px 25px rgba(36,161,222,0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse { 0% {transform: scale(1);} 50% {transform: scale(1.1);} 100% {transform: scale(1);} }
        @keyframes fadeInDown { from {opacity: 0; transform: translateY(-30px);} to {opacity: 1; transform: translateY(0);} }
        @keyframes fadeInUp { from {opacity: 0; transform: translateY(30px);} to {opacity: 1; transform: translateY(0);} }

        @media (max-width: 768px) {
            .container { margin-top: -30px; }
            .section-card { padding: 25px 15px; border-radius: 20px; }
        }
    </style>
</head>
<body>

    <a href="https://t.me/Hell_Broq" class="float-tg">
        <i class="fab fa-telegram-plane"></i>
    </a>

    <header>
        <h1>ЛИАНА КРУТИКОВА</h1>
        <p>ИСКУССТВО МАНИКЮРА • ЕКАТЕРИНБУРГ</p>
    </header>

    <div class="container">
        
        <div class="section-card">
            <h2>О мастере</h2>
            <div class="about-grid">
                <div class="about-text">
                    <p>Добро пожаловать! Я профессиональный мастер с <b>опытом работы более 15 лет</b>. Моя главная цель — не просто сделать красиво, а обеспечить здоровье ваших ногтей.</p>
                    <p>⏱️ <b>Скорость работы:</b> в среднем <b>1:30 мин</b> (от 1 до 2 часов).</p>
                    <p>💎 <b>Качество:</b> покрытие держится <b>минимум 30 дней</b> без отслоек и сколов.</p>
                </div>
            </div>
        </div>

        <div class="section-card">
            <h2>Мои Работы</h2>
            <div class="gallery">
                <div class="gallery-item"><img src="https://i.ibb.co/nNLkyhBw/photo.jpg" alt="Работа 1"></div>
                <div class="gallery-item"><img src="https://i.ibb.co/MDjv6ZS1/photo.jpg" alt="Работа 2"></div>
                <div class="gallery-item"><img src="https://i.ibb.co/8LJVwpL1/photo.jpg" alt="Работа 3"></div>
            </div>
        </div>

        <div class="features">
            <div class="feature-item">
                <i class="fas fa-shield-virus"></i>
                <div>Стерильность</div>
                <p>Крафт-пакеты открываются при вас. Медицинский сухожар.</p>
            </div>
            <div class="feature-item">
                <i class="fas fa-trash-alt"></i>
                <div>Безопасность</div>
                <p>Только одноразовые расходники для каждого клиента.</p>
            </div>
            <div class="feature-item">
                <i class="fas fa-heart"></i>
                <div>Гарантия</div>
                <p>14 дней — любой ремонт за мой счет.</p>
            </div>
        </div>

        <div class="section-card">
            <h2>Прайс-лист</h2>
            <table class="price-table">
                <tr><td>Наращивание ногтей</td><td class="cost">2 500 ₽</td></tr>
                <tr><td>Коррекция</td><td class="cost">1 500 ₽</td></tr>
                <tr><td>Покрытие гель-лаком</td><td class="cost">1 000 ₽</td></tr>
            </table>
        </div>

        <div class="section-card">
            <h2>Отзывы клиентов</h2>
            
            <div class="rating-summary" id="ratingSummary" style="display:none;">
                <span class="avg-num" id="avgNum">0.0</span>
                <div class="stars" id="avgStars" style="font-size: 1.2rem; margin-bottom: 5px;"></div>
                <div style="font-size: 0.8rem; color: #888;">на основе <span id="totalCount">0</span> отзывов</div>
            </div>

            <div id="reviewsContainer" class="reviews-list">
                <p style="text-align:center; color:#999;">Загрузка отзывов...</p>
            </div>

            <div id="reviewFormContainer">
                <h3 style="text-align:center; margin-top:30px; font-size: 1rem;">Оставить отзыв</h3>
                <div class="review-form">
                    
                    <div class="star-selection">
                        <input type="radio" id="st5" name="userRating" value="5"><label for="st5">★</label>
                        <input type="radio" id="st4" name="userRating" value="4"><label for="st4">★</label>
                        <input type="radio" id="st3" name="userRating" value="3"><label for="st3">★</label>
                        <input type="radio" id="st2" name="userRating" value="2"><label for="st2">★</label>
                        <input type="radio" id="st1" name="userRating" value="1"><label for="st1">★</label>
                    </div>

                    <input type="text" id="revName" placeholder="Ваше имя" required>
                    <textarea id="revText" rows="3" placeholder="Ваш отзыв..." required></textarea>
                    <button id="submitBtn" onclick="addReview()" class="review-btn">ОТПРАВИТЬ</button>
                </div>
            </div>
            <p id="thanksMessage" class="already-voted">✅ Вы уже оставляли отзыв. Спасибо за доверие!</p>
        </div>

        <div class="section-card" style="text-align: center;">
            <h2>Записаться</h2>
            <p style="margin-bottom: 30px; color: #666;">Я отвечу вам в Telegram в течение часа.</p>
            
            <a href="https://t.me/Hell_Broq" class="btn btn-tg">
                <i class="fab fa-telegram-plane" style="font-size: 1.5rem;"></i> НАПИСАТЬ В TELEGRAM
            </a>

            <a href="tel:+79634449247" class="btn btn-call">
                <i class="fas fa-phone-alt"></i> ПОЗВОНИТЬ МАСТЕРУ
            </a>

            <button onclick="shareLink()" class="btn btn-share" style="width: 100%; cursor: pointer; border: none; font-family: inherit;">
                <i class="fas fa-share-alt"></i> ПОДЕЛИТЬСЯ С ПОДРУГОЙ
            </button>
            
            <div style="margin-top: 20px; color: #aaa; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 2px;">
                Екатеринбург • 10:00 — 21:00
            </div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyyppfFRNaDaVbhnUfyfGsyAjFnFEvX5AHq3rrUydeASm1JkE6TVJWEBvyUnBVITPE/exec';

        window.onload = function() {
            if (localStorage.getItem('hasReviewed_Global')) {
                document.getElementById('reviewFormContainer').style.display = 'none';
                document.getElementById('thanksMessage').style.display = 'block';
            }
            loadReviews();
        };

        function renderStars(n) {
            let s = '';
            const rating = Math.round(parseFloat(n) || 5);
            for(let i=1; i<=5; i++) s += i <= rating ? '★' : '☆';
            return s;
        }

        function loadReviews() {
            fetch(scriptURL + '?action=get')
                .then(res => res.json())
                .then(data => {
                    const container = document.getElementById('reviewsContainer');
                    
                    // Обработка нового формата данных (reviews и stats)
                    const reviews = data.reviews || [];
                    const stats = data.stats || {avg: "0.0", total: 0};

                    if (reviews.length === 0) {
                        container.innerHTML = '<p style="text-align:center; color:#999;">Отзывов пока нет. Будьте первой!</p>';
                        return;
                    }

                    // Обновляем статистику
                    document.getElementById('ratingSummary').style.display = 'block';
                    document.getElementById('avgNum').innerText = stats.avg;
                    document.getElementById('avgStars').innerText = renderStars(stats.avg);
                    document.getElementById('totalCount').innerText = stats.total;

                    // Отрисовка списка
                    const fragment = document.createDocumentFragment();
                    reviews.forEach(r => {
                        const div = document.createElement('div');
                        div.className = 'review-item';
                        div.innerHTML = `
                            <div class="review-header">
                                <span class="review-name">${r.name}</span>
                                <span class="stars">${renderStars(r.rating)}</span>
                            </div>
                            <p class="review-text">${r.text}</p>
                        `;
                        fragment.appendChild(div);
                    });

                    container.innerHTML = '';
                    container.appendChild(fragment);
                })
                .catch(() => {
                    document.getElementById('reviewsContainer').innerHTML = '<p style="text-align:center; color:#999;">Тут будут ваши отзывы</p>';
                });
        }

        function addReview() {
            const name = document.getElementById('revName').value.trim();
            const text = document.getElementById('revText').value.trim();
            const ratingInput = document.querySelector('input[name="userRating"]:checked');
            const btn = document.getElementById('submitBtn');

            if (!ratingInput) { alert("Пожалуйста, выберите оценку!"); return; }
            if (!name || !text) { alert("Пожалуйста, заполните все поля!"); return; }

            const rating = ratingInput.value;
            btn.disabled = true;
            btn.innerText = 'ОТПРАВЛЕНО...';

            // Optimistic UI: сразу добавляем отзыв в начало списка
            const container = document.getElementById('reviewsContainer');
            const tempDiv = document.createElement('div');
            tempDiv.className = 'review-item';
            tempDiv.style.opacity = '0.6';
            tempDiv.innerHTML = `
                <div class="review-header">
                    <span class="review-name">${name}</span>
                    <span class="stars">${renderStars(rating)}</span>
                </div>
                <p class="review-text">${text}</p>
            `;
            
            // Если была надпись "Отзывов нет", убираем ее
            if (container.innerText.includes("Отзывов пока нет")) {
                container.innerHTML = '';
            }
            
            container.prepend(tempDiv);

            fetch(scriptURL, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-cache',
                body: JSON.stringify({name: name, text: text, rating: rating})
            }).then(() => {
                localStorage.setItem('hasReviewed_Global', 'true');
                tempDiv.style.opacity = '1';
                setTimeout(() => {
                    document.getElementById('reviewFormContainer').style.display = 'none';
                    document.getElementById('thanksMessage').style.display = 'block';
                }, 500);
            }).catch(() => {
                btn.disabled = false;
                btn.innerText = 'ОТПРАВИТЬ';
                alert("Ошибка при отправке. Попробуйте еще раз.");
            });
        }

        function shareLink() {
            if (navigator.share) {
                navigator.share({
                    title: 'Мастер маникюра Лиана Крутикова',
                    text: 'Посмотри, какой крутой мастер маникюра в Екатеринбурге! Стаж 15 лет.',
                    url: window.location.href
                });
            } else {
                alert("Скопируйте ссылку на сайт и отправьте подруге!");
            }
        }
    </script>
</body>
</html>
